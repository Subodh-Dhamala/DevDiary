
[project]
name = "devdiary"
version = "0.1.0"
description = "Developer journal with AI-powered knowledge retrieval"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "greenlet>=3.5.6",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"
